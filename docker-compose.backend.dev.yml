services:
  postgres:
    ports:
      - '5433:5432'

  redis:
    ports:
      - '6379:6379'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/chat_app
      REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: 'true'
    networks:
      - internal
      - web
    ports:
      - '3001:3001'
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
