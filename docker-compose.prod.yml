services:
  postgres:
    profiles: [local]

  redis:
    profiles: [local]

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
    ports:
      - '3001:3001'
    restart: unless-stopped
    depends_on: []
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    ports:
      - '3000:3000'
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
